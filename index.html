<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resumo de Sell Out</title>
<style>
  :root{
    --navy:#0e1f35; --slate:#3f4c61; --grey:#d9d9d9; --lgrey:#efefef;
    --red:#8c0000; --green:#1f9d3a; --blue:#1f4e8c; --bg:#eef0f3;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#111}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 14px;background:#fff;border-bottom:1px solid #ccd}
  .toolbar label{font-size:12px;color:#445}
  .toolbar input[type=date],.toolbar select{padding:4px 6px;font-size:12px}
  .toolbar .file{font-size:12px}
  .chip{margin-left:auto;padding:4px 10px;border-radius:12px;font-size:12px;background:#fff3cd;color:#7a5b00}
  .chip.ok{background:#d9f2e0;color:#136b2c}
  .scroll{overflow-x:auto;padding:14px}
  .sheet{background:#fff;width:100%;min-width:1040px;max-width:1100px;margin:0 auto;padding:12px 12px 20px;box-shadow:0 1px 6px rgba(0,0,0,.15)}
  .top{display:flex;justify-content:space-between;font-weight:bold;font-size:12px;margin-bottom:10px}
  .top .rev{color:var(--blue)} .top .cod{color:#bbb} .top .dt{color:#c00000}
  .head{display:grid;grid-template-columns:110px 1fr;gap:8px;margin-bottom:6px}
  .logo{display:flex;align-items:center;justify-content:center;font-style:italic;font-weight:900;font-size:34px;color:var(--blue);letter-spacing:-2px}
  .title{background:var(--navy);color:#fff;text-align:center;font-size:22px;font-weight:bold;padding:16px 0 12px}
  .title small{display:block;font-size:12px;font-weight:normal;opacity:.8;margin-top:4px}
  table{border-collapse:separate;border-spacing:2px;width:100%}
  th,td{padding:6px 8px;text-align:center;white-space:nowrap}
  th{background:var(--navy);color:#fff;font-size:12px;line-height:1.15}
  td{background:var(--lgrey)}
  td.lbl{background:var(--slate);color:#fff;font-weight:bold;text-align:left;font-size:12px}
  td.g{background:var(--grey)}
  td.b{font-weight:bold}
  td.dark{background:var(--navy);color:#fff;font-weight:bold}
  tr.tot td{background:var(--navy);color:#fff;font-weight:bold}
  tr.tot td.g{background:var(--grey);color:#111}
  tr.gv td{background:#c9d1de;font-weight:bold}
  tr.gv td.lbl{background:var(--navy)}
  tr.st td.lbl{background:var(--slate);font-weight:normal;padding-left:18px}
  .money{display:flex;justify-content:space-between;gap:10px}
  .sec{margin-top:26px}
  .bar{background:var(--navy);color:#fff;text-align:center;font-weight:bold;padding:6px;margin:0 0 4px 118px}
  .bar.red{background:var(--red)}
  .bar.full{margin-left:0}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .grid2.f{grid-template-columns:.9fr 1.1fr}
  tr.tot td.good{background:#eef6ee;color:var(--green)}
  tr.totred td{background:var(--lgrey);font-weight:bold}
  tr.totred td.red{color:#c00000;background:var(--grey)}
  .rank td.prod{max-width:190px;overflow:hidden;text-overflow:ellipsis;text-align:left;font-size:11.5px}
  .rank td.rk{font-weight:bold}
  .aviso{margin:6px 0 0;font-size:11px;color:#778}
  details{max-width:1000px;margin:0 auto 24px;padding:0 14px;font-size:12px}
  details pre{background:#fff;padding:10px;overflow:auto;border:1px solid #dde}
  @media print{.toolbar,details{display:none}.scroll{padding:0}.sheet{box-shadow:none}}
</style>
</head>
<body>

<div class="toolbar">
  <label>Data: <input type="date" id="data"></label>
  <label>Unidade: <select id="unidade"></select></label>
  <label>Visão: <select id="visao"></select></label>
  <label>Categorias por GV/setor: <select id="basecat"><option value="dia">VOL DIA</option><option value="tt">VOL TT (dia + buffer)</option></select></label>
  <label class="file">Cora Pedidos (.csv): <input type="file" id="fCora" accept=".csv,.txt"></label>
  <label class="file">BASE (.csv): <input type="file" id="fBase" accept=".csv,.txt"></label>
  <label class="file">030237 (.csv): <input type="file" id="fBoni" accept=".csv,.txt"></label>
  <span class="chip" id="status">Dados de demonstração</span>
</div>

<div class="scroll"><div class="sheet" id="sheet"></div></div>
<details id="diag"><summary>Conferência dos dados</summary><pre id="diagOut"></pre></details>

<script>
/* =====================================================================
   CONFIGURAÇÃO — regras de cálculo. Ajuste aqui se algo não bater
   com a planilha atual.
   ===================================================================== */
const CONFIG = {
  revenda: 'GP7 - JEQUIÉ',
  codigo: '1027247',

  // Unidades de venda (coluna "Cód. unidade venda" do Cora Pedidos)
  // Cada unidade tem a sua própria estrutura de GVs (faixas de setor)
  unidades: [
    {cod:'1027247', nome:'GP7 - JEQUIÉ',     gvs:[ {nome:'GV 1', de:101, ate:109}, {nome:'GV 2', de:201, ate:208} ]},
    {cod:'1043293', nome:'GP7 - ITAPETINGA', gvs:[ {nome:'GV 1', de:101, ate:110} ]}
  ],

  // Carregados automaticamente se estiverem nesta pasta (quando o HTML estiver num servidor)
  arquivoCora: 'dados/cora_pedidos.csv',
  arquivoBoni: 'dados/030237.csv',
  arquivoBase: 'dados/base.csv',

  campoHecto: 'VOLUME HECTOLITRO',
  campoValor: 'VALOR TOTAL',             // faturamento (com ADF)
  campoValorFalta: 'VALOR LIQUIDO ITEM', // igual à coluna FALTA PRODUTO da planilha (coluna AB)

  ignorarPedido: r => /CANCEL/.test(norm(r['SITUACAO PEDIDO'])),

  // Item em falta: mesma regra da coluna FALTA PRODUTO da planilha (Situação atend. item = FALTA)
  ehFaltaItem: r => norm(r['SITUACAO ATEND. ITEM']) === 'FALTA',

  // Buffer quando "Tipo buffer" tem conteúdo
  ehBuffer: r => !['','NAO','N','0','-','NENHUM'].includes(norm(r['TIPO BUFFER'])),

  // Bonificação do dia
  ehBonif: r => /BONIF/.test(norm(r['DESC. TIPO MOVIMENTO']) + ' ' + norm(r['TIPO PEDIDO'])),

  // Venda feita pelo BEES
  ehBees: r => /BEES/.test(norm(r['CANAL ORIGEM']) + ' ' + norm(r['TIPO CANAL ORIGEM'])),

  ehRGB: r => /RGB/.test(norm(r['CESTA EMBALAGEM'])),
  ehOW:  r => /\bOW\b/.test(norm(r['CESTA EMBALAGEM'])),
  ehHE:  r => norm(r['CESTA HE']) !== ''
};

const CATS = ['CERVEJA','REFRIGENANC','MKTPLACE','AGUA'];

/* ---------- Dados de demonstração (valores da planilha de 05/11/2026) ---------- */
const DEMO = {
  data: '2026-11-05',
  cats: {
    CERVEJA:     {volDia:1167.0,  buffer:200.8, volHE:163.4, volBees:1115.8,  volBoni:0.6, boniDia:667.55, boniMes:0, fat:1066614.82, faltaHecto:0, faltaFat:5720.81},
    REFRIGENANC: {volDia:541.92,  buffer:48.4,  volBees:528.36,  volBoni:0.6, boniDia:158.40, boniMes:0, fat:246917.06,  faltaHecto:0, faltaFat:3916.05},
    MKTPLACE:    {volDia:19.55,   buffer:2.2,   volBees:17.36,   volBoni:0.0, boniDia:0,      boniMes:0, fat:7837.62,    faltaHecto:0, faltaFat:55.26},
    AGUA:        {volDia:81.74,   buffer:6.1,   volBees:70.36,   volBoni:4.3, boniDia:945.70, boniMes:0, fat:18583.59,   faltaHecto:0, faltaFat:14421.59}
  },
  rgb:44, ow:56, he:14,
  bufferR: 199310.90,
  pg: {pix:697326.84, boleto:508675.95, cartao:133950.30, outros:0},
  fatTotal: 1341839.86,
  faltaTotal: {hecto:0, fat:26000.48},
  faltaRank: [
    {produto:'AGUA MIN AGUAS DO PORTO',    fat:9457.00, hecto:42.8},
    {produto:'PEPSI COLA LATA 350ML SH C/', fat:3916.05, hecto:5.1},
    {produto:'BRAHMA CHOPP LT 473ML SH',   fat:2906.40, hecto:3.2},
    {produto:'BRAHMA CHOPP GFA VD 300N',   fat:2814.41, hecto:3.6},
    {produto:'AGUA MIN AGUAS DO PORTO',    fat:2766.24, hecto:7.7},
    {produto:'AGUA MIN PETROPOLIS S/GAS',  fat:2062.77, hecto:13.4},
    {produto:'AGUA MIN AGUAS DO PORTO',    fat:135.58,  hecto:1.3},
    {produto:'TANG REFRESCO EM PO LARAN',  fat:36.84,   hecto:0},
    {produto:'TANG REFRESCO EM PO UVA P',  fat:18.42,   hecto:0}
  ]
};

/* ---------- Utilitários ---------- */
function norm(s){ return (s==null?'':String(s)).normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().trim(); }
function chave(v){ const s=String(v==null?'':v).trim(); return /^\d+$/.test(s) ? String(parseInt(s,10)) : norm(s); }
function num(v){
  if (v==null || v==='') return 0;
  let s = String(v).trim().replace(/[R$\s]/g,'');
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function iso(s){
  s = (s||'').trim();
  let m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/); if (m) return m[3]+'-'+m[2]+'-'+m[1];
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[0] : '';
}
function decode(buf){
  try { return new TextDecoder('utf-8',{fatal:true}).decode(buf); }
  catch(e){ return new TextDecoder('windows-1252').decode(buf); }
}
function parseRows(text){
  text = text.replace(/^﻿/,'');
  const first = text.split(/\r?\n/,1)[0];
  const d = [';','\t',','].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[]; let row=[], f='', q=false;
  for (let i=0;i<text.length;i++){
    const ch=text[i];
    if (q){ if(ch==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=ch; }
    else if (ch==='"') q=true;
    else if (ch===d){ row.push(f); f=''; }
    else if (ch==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
    else if (ch!=='\r') f+=ch;
  }
  if (f!=='' || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function parseCSV(text){
  const rows = parseRows(text);
  const head = rows.shift().map(norm);
  return rows.filter(r=>r.length>1).map(r=>{
    const o={}; head.forEach((h,i)=>o[h]=(r[i]==null?'':r[i]).trim()); return o;
  });
}

/* ---------- BASE: Tipo Marca, Cesta Embalagem, Cesta HE ----------
   Colunas da BASE (por posição): A=Código, C=Tipo Marca, D=Embalagem,
   G:H=Embalagem→Tipo (RGB), J:K=Tipo/SKU→Cesta, M:N=SKU→HE            */
function buildBase(rows){
  const B = {prod:new Map(), cesta:new Map(), embTipo:new Map(), he:new Set()};
  rows.slice(1).forEach(r=>{
    const g = i => (r[i]==null ? '' : String(r[i]).trim());
    if (g(0)){ const k=chave(g(0)); if(!B.prod.has(k)) B.prod.set(k,{marca:g(2), emb:g(3)}); }
    if (g(9) && g(10)){ const k=chave(g(9)); if(!B.cesta.has(k)) B.cesta.set(k,norm(g(10))); }
    if (g(6) && g(7)){ const k=chave(g(6)); if(!B.embTipo.has(k)) B.embTipo.set(k,norm(g(7))); }
    if (g(12)) B.he.add(chave(g(12)));
  });
  return B;
}
// Replica as 3 fórmulas da planilha (TIPO MARCA, CESTA EMBALAGEM, CESTA HE)
function derivar(r, cod, B){
  const k = chave(cod), p = B.prod.get(k);
  let cesta = '';
  if (p && B.cesta.has(chave(p.marca))) cesta = B.cesta.get(chave(p.marca));
  else if (B.cesta.has(k)) cesta = B.cesta.get(k);
  r['TIPO MARCA'] = cesta;
  r['CESTA EMBALAGEM'] = cesta==='CERVEJA' ? ((p && B.embTipo.get(chave(p.emb))) || 'OW') : '';
  r['CESTA HE'] = B.he.has(k) ? 'HE' : '';
}

/* ---------- Estado e elementos ---------- */
const state = {cora:null, boni:null, base:null, pedSetor:new Map()};
const el = {data:document.getElementById('data'), status:document.getElementById('status'),
  sheet:document.getElementById('sheet'), diag:document.getElementById('diagOut'),
  visao:document.getElementById('visao'), basecat:document.getElementById('basecat'),
  unidade:document.getElementById('unidade')};

function unidadeAtual(){ return CONFIG.unidades.find(x=>chave(x.cod)===chave(el.unidade.value)) || null; }
// GVs da unidade selecionada (em "Todas" não há filtro por GV: os setores se repetem entre as unidades)
function gvsAtuais(){ const u = unidadeAtual(); return u ? u.gvs : []; }
function montarVisao(){
  const anterior = el.visao.value;
  let h = '<option value="todos">Todos</option>';
  gvsAtuais().forEach((g,i)=>{ h += '<option value="gv'+(i+1)+'">'+g.nome+' ('+g.de+'–'+g.ate+')</option>'; });
  gvsAtuais().forEach(g=>{
    h += '<optgroup label="Setores '+g.nome+'">';
    for (let s=g.de; s<=g.ate; s++) h += '<option value="s'+s+'">Setor '+s+'</option>';
    h += '</optgroup>';
  });
  el.visao.innerHTML = h;
  el.visao.value = anterior;
  if (!el.visao.value) el.visao.value = 'todos';
}
function passaUnidade(cod){
  const u = el.unidade.value;
  return u==='todas' || chave(cod)===chave(u);
}

function categoria(r){ const t = norm(r['TIPO MARCA']); return CATS.includes(t) ? t : 'OUTROS'; }
function setorDe(r){ const m = String(r['COD. SETOR']||'').match(/\d+/); return m ? parseInt(m[0],10) : 0; }
function passaVisao(setor){
  const v = el.visao.value;
  if (v==='todos') return true;
  if (v.indexOf('gv')===0){ const g = gvsAtuais()[parseInt(v.slice(2),10)-1]; return !!g && setor>=g.de && setor<=g.ate; }
  return setor === parseInt(v.slice(1),10);
}

function prepara(){
  if (state.base){
    if (state.cora) state.cora.forEach(r=>derivar(r, r['COD. PRODUTO'], state.base));
    if (state.boni) state.boni.forEach(r=>derivar(r, r['PRODUTO'], state.base));
  }
  state.pedSetor = new Map();
  if (state.cora) state.cora.forEach(r=>{
    const p = String(r['NUMERO PEDIDO']||'').trim();
    if (p) state.pedSetor.set(p, setorDe(r));
  });
}

/* ---------- Cálculo ---------- */
function emptyCat(){ return {volDia:0,buffer:0,volHE:0,volBees:0,volBoni:0,boniDia:0,boniMes:0,fat:0,faltaHecto:0,faltaFat:0}; }

// Classifica cada linha do dia: venda, buffer, bonif ou falta
function itensDoDia(){
  const d = el.data.value, out = [];
  state.cora.forEach(r=>{
    if (iso(r['DATA ENTREGA'])!==d || CONFIG.ignorarPedido(r)) return;
    if (!passaUnidade(r['COD. UNIDADE VENDA'])) return;
    const buf = CONFIG.ehBuffer(r);
    let tipo;
    if (CONFIG.ehFaltaItem(r)) tipo = buf ? null : 'falta';
    else if (CONFIG.ehBonif(r)) tipo = 'bonif';
    else if (buf) tipo = 'buffer';
    else tipo = 'venda';
    if (!tipo) return;
    out.push({r:r, tipo:tipo, cat:categoria(r), setor:setorDe(r), un:chave(r['COD. UNIDADE VENDA']),
      h:num(r[CONFIG.campoHecto]),
      v:num(tipo==='falta' ? r[CONFIG.campoValorFalta] : r[CONFIG.campoValor])});
  });
  return out;
}

function build(itens){
  const d = el.data.value;
  const cats = {}; CATS.concat('OUTROS').forEach(c=>cats[c]=emptyCat());
  let bufferR=0, fatTotal=0, rgbH=0, owH=0, heH=0;
  const pg={pix:0,boleto:0,cartao:0,outros:0}, prod={};

  itens.forEach(it=>{
    if (!passaVisao(it.setor)) return;
    const c = cats[it.cat], r = it.r;
    if (it.tipo==='falta'){
      c.faltaHecto+=it.h; c.faltaFat+=it.v;
      const k = r['COD. PRODUTO']||r['DESC. PRODUTO'];
      const p = prod[k] || (prod[k] = {produto:r['DESC. PRODUTO']||k, fat:0, hecto:0});
      p.fat+=it.v; p.hecto+=it.h;
    } else if (it.tipo==='bonif'){ c.volBoni+=it.h; c.boniDia+=it.v; }
    else if (it.tipo==='buffer'){ c.buffer+=it.h; bufferR+=it.v; }
    else {
      c.volDia+=it.h; c.fat+=it.v; fatTotal+=it.v;
      if (CONFIG.ehBees(r)) c.volBees+=it.h;
      if (CONFIG.ehHE(r)) c.volHE+=it.h;
      const fp = norm(r['FORMA DE PAGAMENTO']);
      if (/PIX/.test(fp)) pg.pix+=it.v; else if (/BOLETO/.test(fp)) pg.boleto+=it.v;
      else if (/CART/.test(fp)) pg.cartao+=it.v; else pg.outros+=it.v;
      if (it.cat==='CERVEJA'){
        if (CONFIG.ehRGB(r)) rgbH+=it.h;
        if (CONFIG.ehOW(r)) owH+=it.h;
        if (CONFIG.ehHE(r)) heH+=it.h;
      }
    }
  });

  // Bonificado do mês (030237): todas as linhas do mês; em visão filtrada, só pedidos cujo setor é conhecido
  if (state.boni){
    // Só filtra a 030237 por unidade se a coluna REVENDA trouxer os códigos das unidades
    const codsU = CONFIG.unidades.map(u=>chave(u.cod));
    const boniTemUnidade = state.boni.some(r=>codsU.includes(chave(r['REVENDA'])));
    state.boni.forEach(r=>{
      const dt = iso(r['DT. OPERACAO'] || r['EMISSAO']);
      if (dt.slice(0,7)!==d.slice(0,7)) return;
      if (boniTemUnidade && !passaUnidade(r['REVENDA'])) return;
      if (el.visao.value!=='todos'){
        const s = state.pedSetor.get(String(r['NR. PEDIDO']||'').trim());
        if (s==null || !passaVisao(s)) return;
      }
      cats[categoria(r)].boniMes += num(r['TOTAL']);
    });
  }

  const cerv = cats.CERVEJA, denom = (rgbH+owH) || 1, denHE = cerv.volDia || 1;
  const all = Object.values(cats);
  return {
    data:d, cats:cats, bufferR:bufferR, pg:pg, fatTotal:fatTotal,
    rgb:rgbH/denom*100, ow:owH/denom*100, he:heH/denHE*100,
    faltaTotal:{hecto:all.reduce((a,c)=>a+c.faltaHecto,0), fat:all.reduce((a,c)=>a+c.faltaFat,0)},
    faltaRank:Object.values(prod).sort((a,b)=>b.fat-a.fat).slice(0,10)
  };
}

// Volume por setor, separado por categoria (sempre todos os setores)
function novoAcc(){
  const a = {volDia:0, buffer:0, he:0};
  CATS.concat('OUTROS').forEach(c=>{ a['d_'+c]=0; a['b_'+c]=0; });
  return a;
}
function porSetor(itens){
  const S = {};
  itens.forEach(it=>{
    if (it.tipo!=='venda' && it.tipo!=='buffer') return;
    const a = S[it.setor] || (S[it.setor] = novoAcc());
    if (it.tipo==='venda'){ a.volDia+=it.h; a['d_'+it.cat]+=it.h; if (CONFIG.ehHE(it.r)) a.he+=it.h; }
    else { a.buffer+=it.h; a['b_'+it.cat]+=it.h; }
  });
  return S;
}

/* ---------- Formatação ---------- */
const f1 = new Intl.NumberFormat('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1});
const f2 = new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const vol = v => f1.format(v||0);
const pct = v => Math.round(v||0)+'%';
const money = (v,dash) => '<div class="money"><span>R$</span><span>'+((dash && !v)?'-':f2.format(v||0))+'</span></div>';
const dataBR = s => s.split('-').reverse().join('/');

/* ---------- Renderização ---------- */
function volRow(label, a, cls, dash, cols, base){
  const f = x => dash ? '-' : vol(x);
  const catCells = cols.map(c=>'<td>'+f(base==='tt' ? a['d_'+c]+a['b_'+c] : a['d_'+c])+'</td>').join('');
  return '<tr class="'+cls+'"><td class="lbl">'+label+'</td><td class="b">'+f(a.volDia+a.buffer)+'</td><td>'+f(a.volDia)+
    '</td><td class="g">'+f(a.buffer)+'</td>'+catCells+'<td class="b">'+f(a.he)+'</td></tr>';
}
function secGvSetor(itens){
  // "Todas": uma tabela por unidade, porque o mesmo número de setor existe nas duas
  if (itens && el.unidade.value==='todas')
    return CONFIG.unidades.map(u=>blocoGvSetor(itens.filter(it=>it.un===chave(u.cod)), u.gvs, u.nome)).join('');
  const u = unidadeAtual() || CONFIG.unidades[0];
  return blocoGvSetor(itens, u.gvs, itens && el.unidade.value==='todas' ? u.nome : null);
}
function blocoGvSetor(itens, gvs, titulo){
  const base = el.basecat.value, dash = !itens;
  const S = dash ? {} : porSetor(itens);
  const Z = novoAcc;
  const soma = (A,B) => { Object.keys(A).forEach(k=>A[k]+=B[k]||0); return A; };
  // Linha OUTROS só aparece se existir volume sem categoria
  const temOutros = Object.values(S).some(a=>a.d_OUTROS||a.b_OUTROS);
  const cols = temOutros ? CATS.concat('OUTROS') : CATS.slice();
  let rows = '', total = Z();
  const usados = {};
  gvs.forEach(g=>{
    const sub = Z(); let det = '';
    for (let s=g.de; s<=g.ate; s++){
      const a = S[s] || Z(); usados[s]=1; soma(sub,a);
      det += volRow('SETOR '+s, a, 'st', dash, cols, base);
    }
    soma(total, sub);
    rows += volRow(g.nome+' ('+g.de+' a '+g.ate+')', sub, 'gv', dash, cols, base) + det;
  });
  const outros = Z();
  Object.keys(S).forEach(s=>{ if(!usados[s]) soma(outros,S[s]); });
  if (outros.volDia||outros.buffer){ soma(total,outros); rows += volRow('OUTROS SETORES', outros, 'gv', dash, cols, base); }
  rows += volRow('TOTAL', total, 'tot', dash, cols, base);
  const thCat = cols.map(c=>'<th style="background:var(--slate)">'+c+'</th>').join('');
  return '<div class="sec"><div class="bar full">VOLUME POR GV E SETOR'+(titulo?' — '+titulo:'')+' — CATEGORIAS EM '+(base==='tt'?'VOL TT (DIA + BUFFER)':'VOL DIA')+'</div>'+
    '<table><thead><tr><th style="background:none"></th><th>VOL TT</th><th>VOL DIA</th><th>BUFFER</th>'+thCat+'<th>VENDA HE</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    (dash?'<p class="aviso">Carregue o Cora Pedidos (e a BASE) para ver o volume por GV e setor.</p>':'')+'</div>';
}

function render(m, itens){
  const cats = CATS.slice();
  const o = m.cats.OUTROS;
  if (o && (o.volDia||o.buffer||o.fat||o.faltaFat||o.volBoni||o.boniMes)) cats.push('OUTROS');
  const sum = k => cats.reduce((a,c)=>a+(m.cats[c][k]||0),0);
  const T = {volDia:sum('volDia'),buffer:sum('buffer'),volHE:sum('volHE'),volBees:sum('volBees'),volBoni:sum('volBoni'),
             boniDia:sum('boniDia'),boniMes:sum('boniMes'),fat:sum('fat')};
  const fatTotal = m.fatTotal!=null ? m.fatTotal : T.fat;
  const bufferTotal = m.bufferR || 0;
  const pgTot = m.pg.pix+m.pg.boleto+m.pg.cartao+(m.pg.outros||0);

  const rgbCol = [['g',pct(m.rgb)],['dark','VOL OW'],['g',pct(m.ow)],['dark','VOL HE']];
  const sellRow = (c,i) => {
    const x = m.cats[c], tt = x.volDia+x.buffer, sb = x.volDia-x.volBees, peso = x.volDia ? x.volBees/x.volDia*100 : 0;
    const rc = i<4 ? rgbCol[i] : ['g',''];
    return '<tr><td class="lbl">'+c+'</td><td class="b">'+vol(tt)+'</td><td>'+vol(x.volDia)+'</td>'+
      '<td class="g">'+vol(x.buffer)+'</td><td class="b">'+vol(x.volHE)+'</td><td>'+f1.format(x.volDia ? x.volHE/x.volDia*100 : 0)+'%</td><td>'+vol(sb)+'</td><td>'+vol(x.volBees)+'</td>'+
      '<td>'+f1.format(peso)+'%</td><td class="'+rc[0]+'">'+rc[1]+'</td><td>'+vol(x.volBoni)+'</td>'+
      '<td>'+money(x.boniDia,true)+'</td><td>'+money(x.boniMes,true)+'</td></tr>';
  };
  const pesoTot = T.volDia ? T.volBees/T.volDia*100 : 0;
  const sell =
    '<table><thead><tr><th style="background:none"></th><th>VOL TT</th><th>VOL DIA</th><th>BUFFER</th><th>VENDA<br>HE</th><th>% HE</th><th>S/ BEES</th><th>VOL BEES</th><th>PESO<br>BEES</th><th>VOL RGB</th><th>VOL BONI<br>DIA</th><th>BONIFICADO<br>DIA</th><th>BONIFICADO<br>MÊS</th></tr></thead><tbody>'+
    cats.map(sellRow).join('')+
    '<tr class="tot"><td class="lbl">TOTAL</td><td>'+vol(T.volDia+T.buffer)+'</td><td>'+vol(T.volDia)+'</td><td>'+vol(T.buffer)+'</td><td>'+vol(T.volHE)+'</td><td>'+f1.format(T.volDia ? T.volHE/T.volDia*100 : 0)+'%</td><td>'+vol(T.volDia-T.volBees)+
    '</td><td>'+vol(T.volBees)+'</td><td>'+f1.format(pesoTot)+'%</td><td class="g">'+pct(m.he)+'</td><td>'+vol(T.volBoni)+'</td><td>'+money(T.boniDia,true)+'</td><td>'+money(T.boniMes,true)+'</td></tr></tbody></table>';

  const fatRows = cats.map(c=>'<tr><td class="lbl">'+c+'</td><td>'+money(m.cats[c].fat)+'</td><td class="g b">'+pct(fatTotal? m.cats[c].fat/fatTotal*100:0)+'</td></tr>').join('');
  const fat = '<table><tbody>'+fatRows+'<tr class="tot"><td class="lbl">TOTAL</td><td colspan="2" class="good" style="text-align:left">'+money(fatTotal)+'</td></tr></tbody></table>';
  const pag =
    '<table><tbody>'+
    '<tr><td class="lbl" style="text-align:right">BUFFER TOTAL:</td><td>'+money(bufferTotal)+'</td></tr>'+
    '<tr><td colspan="2" style="background:none;padding:6px"></td></tr>'+
    '<tr><td class="lbl" style="text-align:right">PIX</td><td>'+money(m.pg.pix)+'</td></tr>'+
    '<tr><td class="lbl" style="text-align:right">BOLETO</td><td>'+money(m.pg.boleto)+'</td></tr>'+
    '<tr><td class="lbl" style="text-align:right">CARTÃO DE CRÉDITO</td><td>'+money(m.pg.cartao)+'</td></tr>'+
    (m.pg.outros? '<tr><td class="lbl" style="text-align:right">OUTROS</td><td>'+money(m.pg.outros)+'</td></tr>':'')+
    '<tr class="tot"><td class="lbl" style="text-align:right">FAT C/ADF + BUFFER:</td><td class="good" style="text-align:left">'+money(pgTot+bufferTotal)+'</td></tr>'+
    '</tbody></table>';

  const fSum = k => cats.reduce((a,c)=>a+(m.cats[c][k]||0),0);
  const fTot = m.faltaTotal || {hecto:fSum('faltaHecto'), fat:fSum('faltaFat')};
  const faltaRows = cats.map(c=>'<tr><td class="lbl">'+c+'</td><td>'+vol(m.cats[c].faltaHecto)+'</td><td>'+money(m.cats[c].faltaFat)+'</td></tr>').join('');
  const falta =
    '<table><thead><tr><th style="background:none"></th><th style="background:var(--red)">HECTO</th><th style="background:var(--red)">FAT TOTAL R$</th></tr></thead><tbody>'+
    faltaRows+'<tr class="totred"><td class="lbl" style="background:var(--navy)">TOTAL</td><td class="red">'+vol(fTot.hecto)+'</td><td class="red">'+money(fTot.fat)+'</td></tr></tbody></table>';

  let rk = '';
  for (let i=0;i<10;i++){
    const p = m.faltaRank[i], a = (0.6-0.06*i).toFixed(2);
    rk += '<tr class="rank"><td class="rk" style="background:rgba(220,70,70,'+a+')">'+(i+1)+'</td><td class="prod">'+(p?p.produto:'-')+'</td><td>'+(p?money(p.fat):money(0,true))+'</td><td>'+(p?vol(p.hecto):'0,0')+'</td></tr>';
  }
  const rank =
    '<table><thead><tr><th style="background:var(--red)">RKG</th><th style="background:var(--red)">PRODUTO</th><th style="background:var(--red)">FAT</th><th style="background:var(--red)">HECTO</th></tr></thead><tbody>'+rk+'</tbody></table>';

  const visaoTxt = itens ? el.visao.options[el.visao.selectedIndex].text : 'Todos';
  let revTxt = CONFIG.revenda, codTxt = CONFIG.codigo;
  if (itens){
    const u = CONFIG.unidades.find(x=>chave(x.cod)===chave(el.unidade.value));
    if (u){ revTxt = u.nome; codTxt = u.cod; }
    else { revTxt = 'GP7 - '+CONFIG.unidades.map(x=>x.nome.replace(/^GP7 - /,'')).join(' + '); codTxt = ''; }
  }
  el.sheet.innerHTML =
    '<div class="top"><span class="rev">REVENDA: '+revTxt+'</span><span class="cod">'+codTxt+'</span><span class="dt">DATA: '+dataBR(m.data)+'</span></div>'+
    '<div class="head"><div class="logo">GP7</div><div class="title">RESUMO DE SELL OUT<small>Visão: '+visaoTxt+'</small></div></div>'+
    sell+
    secGvSetor(itens)+
    '<div class="sec"><div class="bar">FATURAMENTO</div><div class="grid2" style="grid-template-columns:.8fr 1.2fr;gap:30px"><div>'+fat+'</div><div>'+pag+'</div></div></div>'+
    '<div class="sec"><div class="bar red" style="margin-left:118px">FALTA DE PRODUTO</div><div class="grid2 f"><div>'+falta+'</div><div>'+rank+'</div></div></div>';
}

/* ---------- Conferência dos dados ---------- */
function diagnostico(itens){
  if (!state.cora || !state.cora.length){ el.diag.textContent='Sem arquivo carregado.'; return; }
  const campos = ['COD. UNIDADE VENDA','SITUACAO PEDIDO','TIPO PEDIDO','DESC. TIPO MOVIMENTO','TIPO BUFFER','CANAL ORIGEM',
                  'SITUACAO ATEND. ITEM','FORMA DE PAGAMENTO','COD. SETOR'];
  let out = 'Linhas no Cora Pedidos: '+state.cora.length+(state.base?'   |   BASE: '+state.base.prod.size+' produtos':'   |   BASE não carregada')+'\n';
  const faltam = ['DATA ENTREGA','COD. PRODUTO','COD. SETOR',CONFIG.campoHecto,CONFIG.campoValor,'VALOR LIQUIDO ITEM'].filter(c=>!(c in state.cora[0]));
  if (faltam.length) out += 'ATENÇÃO — colunas não encontradas: '+faltam.join(', ')+'\n';
  campos.forEach(c=>{
    if (!(c in state.cora[0])) { out += '\n'+c+': (coluna não encontrada)\n'; return; }
    const n={}; state.cora.forEach(r=>{ const v=r[c]||'(vazio)'; n[v]=(n[v]||0)+1; });
    const lim = c==='COD. SETOR' ? 40 : 12;
    out += '\n'+c+':\n'+Object.entries(n).sort((a,b)=>b[1]-a[1]).slice(0,lim).map(e=>'  '+e[0]+'  ['+e[1]+']').join('\n')+'\n';
  });
  if (itens){
    const porCat = {}; itens.forEach(it=>{ porCat[it.cat]=(porCat[it.cat]||0)+1; });
    out += '\nLinhas do dia por categoria: '+JSON.stringify(porCat)+'\n';
    const sem = {}; itens.filter(it=>it.cat==='OUTROS').forEach(it=>{
      const k=(it.r['COD. PRODUTO']||'')+' - '+(it.r['DESC. PRODUTO']||'');
      sem[k]=(sem[k]||0)+it.h;
    });
    const lista = Object.entries(sem).sort((a,b)=>b[1]-a[1]).slice(0,10);
    if (lista.length) out += '\nProdutos sem categoria (caem em OUTROS), maiores volumes:\n'+lista.map(e=>'  '+e[0]+'  ['+f1.format(e[1])+' hl]').join('\n')+'\n';
  }
  el.diag.textContent = out;
}

/* ---------- Fluxo ---------- */
function atualizar(){
  const demo = !state.cora;
  el.visao.disabled = el.basecat.disabled = el.unidade.disabled = demo;
  if (demo){ el.data.value = el.data.value || DEMO.data; render(DEMO, null); return; }
  const itens = itensDoDia();
  render(build(itens), itens);
  diagnostico(itens);
}
function setStatus(){
  const p = [];
  if (state.cora) p.push('Cora: '+state.cora.length+' linhas');
  if (state.base) p.push('BASE ok');
  if (state.boni) p.push('030237 ok');
  const temMarca = state.cora && state.cora.length && ('TIPO MARCA' in state.cora[0]);
  const ok = !!state.cora && (state.base || temMarca);
  el.status.className = 'chip'+(ok?' ok':'');
  el.status.textContent = !state.cora ? 'Dados de demonstração'
    : p.join(' · ') + (ok ? '' : ' — falta a BASE (categorias)');
}
async function lerBuf(file){ return decode(await file.arrayBuffer()); }
function definirDataPadrao(){
  const ds = state.cora.map(r=>iso(r['DATA ENTREGA'])).filter(Boolean).sort();
  if (ds.length) el.data.value = ds[ds.length-1];
}
function definirUnidadePadrao(){
  // Se o arquivo tem só uma das unidades conhecidas, já seleciona ela; senão mostra todas
  const achadas = CONFIG.unidades.filter(u=>state.cora.some(r=>chave(r['COD. UNIDADE VENDA'])===chave(u.cod)));
  el.unidade.value = achadas.length===1 ? achadas[0].cod : 'todas';
  montarVisao();
}
function aplicar(novaData){
  prepara();
  if (novaData && state.cora){ definirDataPadrao(); definirUnidadePadrao(); }
  setStatus(); atualizar();
}

document.getElementById('fCora').addEventListener('change', async e=>{
  if (!e.target.files[0]) return;
  state.cora = parseCSV(await lerBuf(e.target.files[0])); aplicar(true);
});
document.getElementById('fBase').addEventListener('change', async e=>{
  if (!e.target.files[0]) return;
  state.base = buildBase(parseRows(await lerBuf(e.target.files[0]))); aplicar(false);
});
document.getElementById('fBoni').addEventListener('change', async e=>{
  if (!e.target.files[0]) return;
  state.boni = parseCSV(await lerBuf(e.target.files[0])); aplicar(false);
});
[el.data, el.visao, el.basecat].forEach(x=>x.addEventListener('change', atualizar));
el.unidade.addEventListener('change', ()=>{ montarVisao(); atualizar(); });

/* Opções dos filtros */
(function montarFiltros(){
  el.unidade.innerHTML = '<option value="todas">Todas</option>' +
    CONFIG.unidades.map(u=>'<option value="'+u.cod+'">'+u.nome+' ('+u.cod+')</option>').join('');
  el.unidade.value = CONFIG.unidades[0].cod;
  montarVisao();
})();

// Carga automática (quando o HTML estiver publicado num servidor com a pasta dados/)
(async function init(){
  el.data.value = DEMO.data;
  atualizar();
  try {
    const r1 = await fetch(CONFIG.arquivoCora, {cache:'no-store'});
    if (!r1.ok) return;
    state.cora = parseCSV(decode(await r1.arrayBuffer()));
    try { const r = await fetch(CONFIG.arquivoBase, {cache:'no-store'});
          if (r.ok) state.base = buildBase(parseRows(decode(await r.arrayBuffer()))); } catch(e){}
    try { const r = await fetch(CONFIG.arquivoBoni, {cache:'no-store'});
          if (r.ok) state.boni = parseCSV(decode(await r.arrayBuffer())); } catch(e){}
    aplicar(true);
  } catch(e){ /* sem arquivos na pasta: segue na demonstração */ }
})();
</script>
